    .toggle-btn { flex: 1; padding: 10px 6px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: transparent; color: #888; font-weight: 700; font-size: 12px; cursor: pointer; font-family: inherit; letter-spacing: 0.3px; line-height: 1.3; text-align: center; }
    .toggle-btn.active { border-color: rgba(0,255,136,0.5); background: rgba(0,255,136,0.1); color: #00ff88; }
    .toggle-btn .sub { font-size: 9px; opacity: 0.7; display: block; font-weight: 400; letter-spacing: 0; }

    .btn-primary { width: 100%; padding: 16px; border-radius: 10px; border: none; background: linear-gradient(135deg, #00ff88, #00cc66); color: #000; font-weight: 900; font-size: 15px; letter-spacing: 2px; cursor: pointer; margin-bottom: 10px; font-family: inherit; }
    .btn-ghost { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: transparent; color: #888; font-weight: 700; font-size: 13px; letter-spacing: 1px; cursor: pointer; margin-bottom: 10px; font-family: inherit; }

    .btn-sm { padding: 6px 14px; border-radius: 6px; font-weight: 800; font-size: 12px; cursor: pointer; font-family: inherit; border: none; }

    .exercise-card { cursor: pointer; padding: 12px 14px !important; }
    .round-bar { display: flex; gap: 6px; margin-bottom: 16px; }
    .round-seg { flex: 1; height: 4px; border-radius: 2px; }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .stat-box { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 14px 8px; text-align: center; }

    .switch { width: 44px; height: 24px; border-radius: 12px; cursor: pointer; position: relative; transition: background 0.2s; flex-shrink: 0; }
    .switch-thumb { position: absolute; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left 0.2s; }

    .round-pills { display: flex; gap: 4px; margin-top: 10px; justify-content: center; flex-wrap: wrap; }
    .round-pill { font-size: 11px; border-radius: 8px; padding: 1px 7px; }
    .rep-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }
    .rep-btn { padding: 8px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 14px; font-family: inherit; }

    .history-exercises { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .ex-tag { font-size: 11px; color: #aaa; background: rgba(255,255,255,0.06); border-radius: 10px; padding: 2px 8px; }
    .breakdown-row { display: flex; justify-content: space-between; padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.06); align-items: center; }

function shuffle(a) { return [...a].sort(()=>Math.random()-0.5); }
function fmtTime(s) { return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function fmtDur(s) { const m=Math.floor(s/60); return m>0?`${m}m ${s%60}s`:`${s}s`; }
function dateStr(iso) { return new Date(iso).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}); }
function dateLong(iso) { return new Date(iso).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}); }

let state = {
  screen: 'home',
  selectedType: 'circuit',
  selectedLevel: 'intermediate',
  selectedDuration: 30,
  workout: null,
  currentRound: 0,
  timerSeconds: 0,
  timerRunning: false,
  history: [],
  historyDetail: null,
  expandedEx: null,
};

function loadHistory() {
  try { state.history = JSON.parse(localStorage.getItem('forge_history')||'[]'); } catch { state.history=[]; }
}
function saveHistory() { localStorage.setItem('forge_history', JSON.stringify(state.history)); }
loadHistory();

// ─── TIMER ────────────────────────────────────────────────────────────────────
let timerInterval = null;
function startTimer() {
  if (timerInterval) return;
  state.timerRunning = true;
  timerInterval = setInterval(()=>{ state.timerSeconds++; renderTimerOnly(); }, 1000);
}
function stopTimer() { clearInterval(timerInterval); timerInterval=null; state.timerRunning=false; }
function resetTimer() { stopTimer(); state.timerSeconds=0; }
function renderTimerOnly() {
  const el = document.getElementById('elapsed-display');
  if (el) { el.textContent=fmtTime(state.timerSeconds); el.style.color=state.timerRunning?'#00ff88':state.timerSeconds>0?'#ffcc00':'#555'; }
  const btn = document.getElementById('timer-toggle-btn');
  if (btn) { btn.textContent=state.timerRunning?'⏸ PAUSE':state.timerSeconds===0?'▶ START':'▶ RESUME'; btn.style.background=state.timerRunning?'#ff6b35':'#00ff88'; }
}

  const {selectedType:type, selectedLevel:level, selectedDuration:dur} = state;

  const {exCount, rounds} = params;
  const li = LEVEL_IDX[level];

  // Always include staples; fill remaining slots randomly from pool (excluding staple names)
  const staples = STAPLES[type];
  const stapleNames = new Set(staples.map(s=>s.name));
  const pool = EXERCISES[type].filter(ex=>!stapleNames.has(ex.name));
  const randomCount = Math.max(0, exCount - staples.length);
  const randomPick = shuffle(pool).slice(0, randomCount);

  // Shuffle staples into the random selection so they appear at random positions
  const selected = shuffle([...staples, ...randomPick]);
  state.workout = {
    id: Date.now(), type, level, duration_target: dur, rounds,
    date: new Date().toISOString(),
    exercises: selected.map(ex=>({
      ...ex,
      target: ex.type==='reps' ? ex.reps[li] : ex.seconds[li],
      completedRounds: Array(rounds).fill(null),
    })),
    includeBike: false, bikeCompleted: false, completed: false,
  };
  state.currentRound=0; state.expandedEx=null;
  resetTimer();
  // clear countdown state
  Object.keys(countdownState).forEach(k=>{ clearInterval(countdownState[k].interval); delete countdownState[k]; });
}

  const root = document.getElementById('root');

}

// ─── COUNTDOWN TIMERS ─────────────────────────────────────────────────────────
const countdownState = {};
function renderCountdown(total, exIdx) {
  const key=`cd_${exIdx}`;
  if (!countdownState[key]) countdownState[key]={left:total,running:false,interval:null};
  const cd=countdownState[key];
  const pct=((total-cd.left)/total)*100, circ=2*Math.PI*34;
  const m=Math.floor(cd.left/60),s=cd.left%60;
  const display=m>0?`${m}:${String(s).padStart(2,'0')}`:cd.left;
  return `<div style="text-align:center;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.08)" onclick="event.stopPropagation()">
    <div style="position:relative;width:80px;height:80px;margin:0 auto 8px">
      <svg width="80" height="80" style="transform:rotate(-90deg)">
        <circle cx="40" cy="40" r="34" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="6"/>
        <circle id="cd-arc-${exIdx}" cx="40" cy="40" r="34" fill="none" stroke="${cd.left<=5?'#ff4444':'#00ff88'}" stroke-width="6" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-pct/100)}" style="transition:stroke-dashoffset 1s linear"/>
      </svg>
      <div id="cd-display-${exIdx}" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:${cd.left<=5?'#ff4444':'#fff'};font-family:monospace">${display}</div>
    </div>
    <div style="display:flex;gap:6px;justify-content:center">
      <button class="btn-sm" style="background:${cd.running?'#ff6b35':'#00ff88'};color:#000;padding:4px 14px" onclick="toggleCountdown(${exIdx},${total})">${cd.running?'⏸':cd.left===0?'✓':'▶'}</button>
      <button class="btn-sm" style="border:1px solid rgba(255,255,255,0.2);background:transparent;color:#aaa;padding:4px 10px" onclick="resetCountdown(${exIdx},${total})">↺</button>
    </div>
  </div>`;
}
function toggleCountdown(exIdx,total) {
  const key=`cd_${exIdx}`;
  if (!countdownState[key]) countdownState[key]={left:total,running:false,interval:null};
  const cd=countdownState[key];
  if (cd.running) { clearInterval(cd.interval);cd.interval=null;cd.running=false;updateCountdownUI(exIdx,total); }
  else if (cd.left>0) {
    cd.running=true;
    cd.interval=setInterval(()=>{ cd.left--; updateCountdownUI(exIdx,total); if(cd.left<=0){clearInterval(cd.interval);cd.interval=null;cd.running=false;logRep(exIdx,state.currentRound,total);} },1000);
    updateCountdownUI(exIdx,total);
  }
}
function resetCountdown(exIdx,total) {
  if(countdownState[`cd_${exIdx}`]) clearInterval(countdownState[`cd_${exIdx}`].interval);
  countdownState[`cd_${exIdx}`]={left:total,running:false,interval:null};
  updateCountdownUI(exIdx,total);
}
function updateCountdownUI(exIdx,total) {
  const cd=countdownState[`cd_${exIdx}`]; if(!cd) return;
  const circ=2*Math.PI*34, pct=((total-cd.left)/total)*100;
  const arc=document.getElementById(`cd-arc-${exIdx}`), disp=document.getElementById(`cd-display-${exIdx}`);
  if(arc){arc.setAttribute('stroke-dashoffset',circ*(1-pct/100));arc.setAttribute('stroke',cd.left<=5?'#ff4444':'#00ff88');}
  if(disp){const m=Math.floor(cd.left/60),s=cd.left%60;disp.textContent=m>0?`${m}:${String(s).padStart(2,'0')}`:cd.left;disp.style.color=cd.left<=5?'#ff4444':'#fff';}
}

// ─── DETAIL SCREEN ────────────────────────────────────────────────────────────
function renderDetail() {
  const w=state.historyDetail, lc=LEVEL_COLORS[w.level]||'#888';
  const exercises=w.exercises.map(ex=>{
    const boxes=ex.completedRounds.map((r,ri)=>`<div class="round-box" style="background:${r!==null?'rgba(0,255,136,0.1)':'rgba(255,255,255,0.04)'};border:1px solid ${r!==null?'rgba(0,255,136,0.2)':'rgba(255,255,255,0.06)'}">
      <div style="font-size:10px;color:#888;margin-bottom:2px">R${ri+1}</div>
      <div style="font-weight:800;color:${r!==null?'#00ff88':'#555'};font-size:14px">${r!==null?r:'–'}</div>
    </div>`).join('');
    return `<div class="card" style="padding:12px 14px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-weight:700;color:#fff">${ex.icon} ${ex.name}</div>
        <div style="font-size:12px;color:#888">Target: ${ex.target}${ex.type==='reps'?' reps':'s'}</div>
      </div>
      <div class="round-boxes">${boxes}</div>
    </div>`;
  }).join('');
  const bike=w.bikeCompleted?`<div class="card" style="padding:12px 14px;background:rgba(0,170,255,0.08);border:1px solid rgba(0,170,255,0.2)">🚴 <span style="color:#00aaff;font-weight:700">30-min bike ride completed</span></div>`:'';
  return `<div class="screen"><div class="bg"></div><div class="container">
    <button class="btn-ghost" style="width:auto;padding:6px 14px;margin-bottom:16px" onclick="setState({screen:'history'})">← BACK</button>
    <div style="margin-bottom:20px">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px">
        <span style="color:${lc};font-size:12px;font-weight:700;letter-spacing:1px">${(w.level||'').toUpperCase()}</span>
        <span style="color:#555">·</span>
        <span style="color:#888;font-size:12px">${w.type.charAt(0).toUpperCase()+w.type.slice(1)} · ${w.duration_target||'?'} min</span>
      </div>
      <h2 style="color:#fff;font-size:22px;font-weight:900;margin:0 0 4px">${dateLong(w.date)}</h2>
      <div style="color:#00ff88;font-weight:700">⏱ ${fmtDur(w.duration||0)} · ${w.rounds} rounds</div>
    </div>
    ${exercises}${bike}
  </div></div>`;
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function setState(updates) { Object.assign(state,updates); render(); }
function showInstallBanner() { document.getElementById('install-banner').classList.add('show'); }
function checkInstall() {
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent), isStandalone=window.navigator.standalone===true;
  if(isIOS&&!isStandalone) setTimeout(()=>document.getElementById('install-banner').classList.add('show'),2000);
}

render();
checkInstall();
</script>
</body>
</html>
